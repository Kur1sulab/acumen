name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单测 · py${{ matrix.python }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 已 EOL，ubuntu-latest（26.04）不再预置，固定到 22.04。
          # 内网老机器上 3.9 依然常见，这条兼容线得留着。
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 跑单测
        run: python -m unittest discover -s tests -v

  zero-dep:
    name: 零依赖自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 全部 import 必须来自标准库
        run: python tools/check_zero_deps.py

  offline:
    name: 离网自检（无出站能力）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 不得存在出站模块 / 外部资源引用 / 下载命令
        run: python tools/check_offline.py

  frontend:
    name: 前端零构建自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: JS 语法检查
        run: |
          set -e
          for js in $(find vc/ui -name '*.js'); do
            node --check "$js"
            echo "OK  $js"
          done
