name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 单测 · py${{ matrix.python }} @ ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # 3.9 已 EOL，ubuntu-latest（26.04）不再预置，固定到 22.04。
          # 内网老机器上 3.9 依然常见，这条兼容线得留着。
          - os: ubuntu-22.04
            python: "3.9"
          - os: ubuntu-latest
            python: "3.12"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.12"
          - os: macos-latest
            python: "3.13"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 跑单测
        run: python -m unittest discover -s tests -v

  engine:
    name: 引擎（Go）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine-go/go.mod
      - name: go vet
        working-directory: engine-go
        run: go vet ./...
      - name: 三平台都要能编出来
        working-directory: engine-go
        run: |
          set -e
          go build -o /tmp/sweep-linux ./cmd/sweep
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/sweep.exe ./cmd/sweep
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -o /tmp/sweep-darwin ./cmd/sweep
          /tmp/sweep-linux version
          ls -l /tmp/sweep-linux /tmp/sweep.exe /tmp/sweep-darwin

  zero-dep:
    name: 零依赖自检
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 全部 import 必须来自标准库
        run: python tools/check_zero_deps.py

  offline:
    name: 只朝目标发请求（不朝第三方）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 无遥测 / 无云查杀 / 无更新检查
        run: python tools/check_offline.py
